<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de profissional — Consulta Fácil HN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <svg class="mark" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="20" cy="20" r="18" stroke="#0E5C4E" stroke-width="2.5"/>
      <path d="M8 20h6l3-8 4 16 3-8h8" stroke="#D98E2B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <a class="brand" href="index.html">Consulta Fácil HN</a>
    <span class="brand-sub">Hugo Napoleão – PI</span>
  </div>
</header>

<main>
  <a class="back-link" href="index.html">&larr; Voltar</a>
  <h1>Cadastro de profissional de saúde</h1>
  <p>Preencha os dados abaixo para cadastrar um profissional e vincular suas especialidades. (RF02)</p>

  <div id="alert" class="alert" style="display:none;" role="alert"></div>

  <div class="card">
    <form id="form-profissional" novalidate>
      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required>
        <span class="field-error"></span>
      </div>
      <div class="field">
        <label for="registro">Registro profissional (CRM, COREN...)</label>
        <input type="text" id="registro" name="registro" required>
        <span class="field-error"></span>
      </div>
      <div class="field">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
        <span class="field-error"></span>
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>
        <span class="field-error"></span>
      </div>
      <div class="field">
        <label>Especialidades</label>
        <span class="hint">Selecione uma ou mais.</span>
        <div class="checkbox-group" id="lista-especialidades"></div>
      </div>
      <button type="submit" class="primary">Cadastrar</button>
    </form>
  </div>

  <div class="list-section">
    <h2>Profissionais cadastrados</h2>
    <div id="tabela-profissionais"></div>
  </div>
</main>

<footer>Projeto Integrador II — Equipe Inova — UESPI/UAPI</footer>

<script src="js/mockLoader.js"></script>
<script src="js/cadastroProfissional.js"></script>
</body>
</html>
